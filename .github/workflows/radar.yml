# Corre el radar cada hora (busca ofertas cada ~3) y te avisa por Telegram.
name: Radar de empleo

on:
  schedule:
    # Cada hora. GitHub saltea corridas programadas cuando está cargado, así que pedir más seguido
    # asegura el ritmo. El radar decide: cada hora lee los botones de Telegram, y cada ~3 horas
    # (entre las 8 y las 24 de Argentina) busca ofertas.
    - cron: "37 * * * *"
  workflow_dispatch:   # botón "Run workflow" para correrlo a mano
    inputs:
      modo:
        description: "normal = busca ya y avisa · auto = como la tarea programada (lo usa el disparador externo) · muestra = diagnóstico"
        type: choice
        options: [normal, auto, muestra]
        default: normal

permissions:
  contents: write   # para guardar datos/vistos.json (las ofertas ya revisadas)

concurrency:
  group: radar
  cancel-in-progress: false

jobs:
  radar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Diagnóstico de fuentes
        if: github.event.inputs.modo == 'muestra'
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: python -m radar_empleo --muestra

      - name: Buscar ofertas y avisar
        if: github.event.inputs.modo != 'muestra'
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}                 # opcional: alertas por mail
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          FORZAR: ${{ github.event.inputs.modo == 'normal' && '1' || '0' }}   # a mano (normal): buscar siempre
        run: python -m radar_empleo

      - name: Guardar ofertas ya revisadas
        if: github.event.inputs.modo != 'muestra'
        run: |
          git config user.name "radar-empleo[bot]"
          git config user.email "radar-empleo@users.noreply.github.com"
          git add datos/
          git diff --cached --quiet || git commit -m "Radar: actualizar ofertas revisadas [skip ci]"
          git push
