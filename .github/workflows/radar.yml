# Corre el radar cada 3 horas y te avisa por Telegram.
name: Radar de empleo

on:
  schedule:
    # Cada 3 horas entre las 8 y las 23 de Argentina (el horario de GitHub es UTC = Argentina + 3):
    # 8:17, 11:17, 14:17, 17:17, 20:17 y 23:17
    - cron: "17 2,11,14,17,20,23 * * *"
  workflow_dispatch:   # botón "Run workflow" para correrlo a mano
    inputs:
      modo:
        description: "normal = avisa por Telegram · muestra = imprime cómo llegan los datos de cada fuente"
        type: choice
        options: [normal, muestra]
        default: normal

permissions:
  contents: write   # para guardar datos/vistos.json (las ofertas ya revisadas)

concurrency:
  group: radar
  cancel-in-progress: false

jobs:
  radar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Diagnóstico de fuentes
        if: github.event.inputs.modo == 'muestra'
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: python -m radar_empleo --muestra

      - name: Buscar ofertas y avisar
        if: github.event.inputs.modo != 'muestra'
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}                 # opcional: alertas por mail
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: python -m radar_empleo

      - name: Guardar ofertas ya revisadas
        if: github.event.inputs.modo != 'muestra'
        run: |
          git config user.name "radar-empleo[bot]"
          git config user.email "radar-empleo@users.noreply.github.com"
          git add datos/vistos.json
          git diff --cached --quiet || git commit -m "Radar: actualizar ofertas revisadas [skip ci]"
          git push
