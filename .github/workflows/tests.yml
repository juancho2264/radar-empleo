# Corre los tests en cada cambio de código.
name: Tests

on:
  push:
    paths: ["radar_empleo/**", "tests/**", "perfil.yaml", "requirements*.txt", ".github/workflows/tests.yml"]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q
